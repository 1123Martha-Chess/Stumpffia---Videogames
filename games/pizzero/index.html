<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Pizzero — Stumpffia</title>
<meta name="theme-color" content="#0B1A4A">
<meta name="color-scheme" content="dark">
<link rel="icon" href="/assets/img/icon-192.png" type="image/png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="/assets/css/fuente.css">
<style>
  :root {
    --marino:#0B1A4A; --tarjeta:#13295E; --claro:#7EC8F2;
    --apagado:#8FB4D8; --borde:rgba(126,200,242,.18);
  }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { height:100%; }
  body {
    margin:0; background:var(--marino); color:var(--claro);
    font:15px/1.4 "Nunito",ui-rounded,"SF Pro Rounded",system-ui,sans-serif;
    overflow:hidden; touch-action:none; -webkit-user-select:none; user-select:none;
  }
  canvas { position:fixed; inset:0; display:block; image-rendering:pixelated; touch-action:none; }

  #hud {
    position:fixed; top:0; left:0; right:0; z-index:3;
    display:flex; align-items:flex-start; gap:8px; flex-wrap:wrap;
    padding:10px 12px; padding-top:calc(10px + env(safe-area-inset-top));
    pointer-events:none;
  }
  .ficha {
    display:flex; flex-direction:column; align-items:center; gap:1px;
    padding:5px 11px; border-radius:13px;
    background:rgba(19,41,94,.94); border:1px solid var(--borde);
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    font-variant-numeric:tabular-nums;
  }
  .ficha span { font-size:9px; font-weight:800; letter-spacing:.14em; color:var(--apagado); }
  .ficha b { font-size:15px; font-weight:800; color:var(--claro); }
  .ficha.urgente { border-color:var(--claro); animation:latir .7s infinite; }
  @keyframes latir { 50% { background:var(--claro); color:var(--marino); } }
  #pizzas { display:flex; gap:8px; margin-left:auto; }
  @media (prefers-reduced-motion: reduce) { .ficha.urgente { animation:none; } }

  #mando { display:none; }
  body.tactil #mando {
    display:flex; position:fixed; inset:auto 0 0 0; z-index:4;
    padding:0 18px calc(18px + env(safe-area-inset-bottom)); justify-content:center;
  }
  .cruz { display:grid; grid-template-columns:repeat(3,54px); grid-template-rows:repeat(3,54px); }
  .cruz button { grid-area:var(--pos); }
  #mando button {
    border:2px solid var(--claro); background:rgba(11,26,74,.55); color:var(--claro);
    border-radius:12px; font:inherit; font-size:20px; font-weight:700; cursor:pointer;
  }
  #mando button:active { background:var(--claro); color:var(--marino); }

  #capa {
    position:fixed; inset:0; z-index:10;
    display:none; align-items:center; justify-content:center; padding:20px;
    background:rgba(11,26,74,.72);
    backdrop-filter:saturate(160%) blur(18px); -webkit-backdrop-filter:saturate(160%) blur(18px);
  }
  #capa.visible { display:flex; }
  .tarjeta {
    width:min(420px,100%); padding:34px 30px 26px; text-align:center;
    background:var(--tarjeta); border:1px solid var(--borde); border-radius:28px;
    box-shadow:0 30px 70px rgba(0,0,0,.45);
  }
  .tarjeta-marca {
    width:46px; height:46px; margin:0 auto 16px; background:var(--claro);
    -webkit-mask:url("/assets/img/logo-96.png") center/contain no-repeat;
    mask:url("/assets/img/logo-96.png") center/contain no-repeat;
  }
  .tarjeta h1 { margin:0 0 8px; font-size:clamp(28px,7.5vw,38px); font-weight:800; letter-spacing:-.03em; line-height:1.1; }
  .tarjeta p { margin:0; color:var(--apagado); font-size:15px; line-height:1.5; }
  .tarjeta button {
    width:100%; min-height:50px; margin-top:22px;
    border:none; border-radius:999px; cursor:pointer;
    font:inherit; font-size:16px; font-weight:800;
    background:var(--claro); color:var(--marino);
    transition:transform .12s ease, opacity .15s ease;
  }
  .tarjeta button:hover { opacity:.88; }
  .tarjeta button:active { transform:scale(.98); }
  .marcas { margin:22px 0 0; padding:14px 2px 2px; border-top:1px solid var(--borde); display:grid; gap:9px; font-size:13px; }
  .marcas div { display:flex; align-items:center; justify-content:space-between; gap:12px; }
  .marcas span { color:var(--apagado); }
  .marcas b { font:inherit; font-size:12px; font-weight:700; font-variant-numeric:tabular-nums; }
  .tarjeta a { display:inline-block; margin-top:18px; color:var(--apagado); font-size:13px; font-weight:700; text-decoration:none; }
  .tarjeta a:hover { color:var(--claro); }
</style>
</head>
<body>

<div id="hud">
  <div class="ficha"><span>ENTREGAS</span><b id="entregas">0</b></div>
  <div class="ficha" id="ficha-despido"><span>SIN ENTREGAR</span><b id="despido">5:00</b></div>
  <div class="ficha"><span>REPARTO</span><b id="vehiculo">A pie</b></div>
  <div id="pizzas"></div>
</div>

<canvas id="lienzo"></canvas>

<div id="mando" aria-hidden="true">
  <div class="cruz">
    <button data-dir="arriba"    style="--pos:1/2">▲</button>
    <button data-dir="izquierda" style="--pos:2/1">◀</button>
    <button data-dir="derecha"   style="--pos:2/3">▶</button>
    <button data-dir="abajo"     style="--pos:3/2">▼</button>
  </div>
</div>

<div id="capa">
  <div class="tarjeta">
    <div class="tarjeta-marca" aria-hidden="true"></div>
    <h1 id="capa-titulo">Pizzero</h1>
    <p id="capa-texto"></p>
    <button id="capa-boton">Empezar el turno</button>
    <div class="marcas" id="capa-marcas"></div>
    <a href="/">Volver a Stumpffia</a>
  </div>
</div>

/* ───────────────── Atlas ───────────────── */

function aBytes(base64) {
  const bin = atob(base64);
  const b = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) b[i] = bin.charCodeAt(i);
  return b;
}

function filasDe(bits, n) {
  const filas = [];
  for (let y = 0; y < TAM; y++) {
    const fila = [];
    for (let x = 0; x < TAM; x++) {
      const i = y * TAM + x;
      fila.push((bits[n * 32 + (i >> 3)] >> (7 - (i & 7))) & 1);
    }
    filas.push(fila);
  }
  return filas;
}

/* Los sprites de personaje llevan fondo transparente: el 0 que se toca con
   el borde es aire, el 0 encerrado por 1 son ojos y ventanas. */
function recortarFondo(filas) {
  const fuera = new Uint8Array(TAM * TAM), cola = [];
  for (let i = 0; i < TAM; i++) {
    for (const [x, y] of [[i, 0], [i, TAM-1], [0, i], [TAM-1, i]]) {
      const p = y * TAM + x;
      if (!fuera[p] && filas[y][x] === 0) { fuera[p] = 1; cola.push([x, y]); }
    }
  }
  while (cola.length) {
    const [x, y] = cola.pop();
    for (const [dx, dy] of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const nx = x + dx, ny = y + dy;
      if (nx < 0 || ny < 0 || nx >= TAM || ny >= TAM) continue;
      const p = ny * TAM + nx;
      if (fuera[p] || filas[ny][nx] !== 0) continue;
      fuera[p] = 1; cola.push([nx, ny]);
    }
  }
  return fuera;
}

function hojaDe(listaFilas, opciones) {
  const c = document.createElement("canvas");
  c.width = TAM * listaFilas.length; c.height = TAM;
  const ctx2 = c.getContext("2d");
  const img = ctx2.createImageData(c.width, TAM);
  const cl = [0x7e, 0xc8, 0xf2], ma = [0x0b, 0x1a, 0x4a];

  listaFilas.forEach(function (filas, n) {
    const fuera = opciones.transparente ? recortarFondo(filas) : null;
    for (let y = 0; y < TAM; y++) {
      for (let x = 0; x < TAM; x++) {
        const o = (y * c.width + n * TAM + x) * 4;
        if (fuera && fuera[y * TAM + x]) { img.data[o + 3] = 0; continue; }
        const encendido = filas[y][x] === 1;
        const color = (opciones.invertido ? !encendido : encendido) ? cl : ma;
        img.data[o] = color[0]; img.data[o+1] = color[1];
        img.data[o+2] = color[2]; img.data[o+3] = 255;
      }
    }
  });
  ctx2.putImageData(img, 0, 0);
  return c;
}

const bitsSprite = aBytes(BITS);
const indice = {};
NOMBRES.forEach(function (n, i) { indice[n] = i; });
const ATLAS_SPRITES = hojaDe(NOMBRES.map(function (_, n) { return filasDe(bitsSprite, n); }),
                             { transparente: true });

const bitsCiudad = aBytes(CIUDAD_CASILLAS);
const filasCiudad = [];
for (let n = 0; n < bitsCiudad.length / 32; n++) filasCiudad.push(filasDe(bitsCiudad, n));
const ATLAS_CIUDAD = hojaDe(filasCiudad, {});
const ATLAS_CIUDAD_MARCADA = hojaDe(filasCiudad, { invertido: true });

/* las 20 manzanas del dibujo, como rejillas de índices */
const UNIDADES = CIUDAD_UNIDADES.map(function (u) {
  return u.split(";").map(function (f) { return f.split(",").map(Number); });
});
const CASILLA_CALLE = UNIDADES[0][0][0];

/* ───────────────── La ciudad ───────────────── */

const ciudad = {
  celdas: new Map(),      // "cx,cy" -> qué manzana del dibujo va ahí
  minX: 0, minY: 0, cols: 0, filas: 0,
  ancho: 0, alto: 0,
  tipo: null, casilla: null,
  puertas: [], pizzeria: null
};

function enMapa(x, y) { return x >= 0 && y >= 0 && x < ciudad.ancho && y < ciudad.alto; }
function tipoEn(x, y) { return enMapa(x, y) ? ciudad.tipo[y * ciudad.ancho + x] : T_NIEBLA; }
function pisable(x, y) { const t = tipoEn(x, y); return t === T_CALLE || t === T_BANQUETA; }

let semilla = 1;
function azar() {
  semilla = (semilla * 1103515245 + 12345) & 0x7fffffff;
  return semilla / 0x7fffffff;
}
const entero = (n) => Math.floor(azar() * n);

/* Cualquier manzana menos la pizzería, que es única. */
function manzanaAlAzar() {
  let d;
  do { d = entero(UNIDADES.length); } while (d === CIUDAD_PIZZERIA);
  return d;
}

/* Dentro de una manzana: calzada, banqueta o casa. */
function tipoDeCasilla(ux, uy) {
  if (ux < CIUDAD_CALLE || uy < CIUDAD_CALLE) return T_CALLE;
  const bx = ux - CIUDAD_CALLE, by = uy - CIUDAD_CALLE;
  const orilla = bx < CIUDAD_BANQUETA || by < CIUDAD_BANQUETA ||
                 bx >= CIUDAD_MANZANA - CIUDAD_BANQUETA ||
                 by >= CIUDAD_MANZANA - CIUDAD_BANQUETA;
  return orilla ? T_BANQUETA : T_CASA;
}

/* Pasa el mapa de celdas a casillas. Devuelve cuánto se ha corrido todo:
   si la ciudad crece hacia arriba o hacia la izquierda el origen cambia y
   hay que mover al pizzero y a los destinos con él. */
function volcarCiudad() {
  let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
  for (const clave of ciudad.celdas.keys()) {
    const partes = clave.split(",");
    const cx = +partes[0], cy = +partes[1];
    if (cx < minX) minX = cx;
    if (cx > maxX) maxX = cx;
    if (cy < minY) minY = cy;
    if (cy > maxY) maxY = cy;
  }
  const corrimiento = { x: (ciudad.minX - minX) * UNIDAD, y: (ciudad.minY - minY) * UNIDAD };
  ciudad.minX = minX; ciudad.minY = minY;
  ciudad.cols = maxX - minX + 1;
  ciudad.filas = maxY - minY + 1;

  /* la ciudad cierra con calzada a la derecha y abajo, y niebla alrededor */
  ciudad.ancho = ciudad.cols * UNIDAD + CIUDAD_CALLE + NEBLINA * 2;
  ciudad.alto  = ciudad.filas * UNIDAD + CIUDAD_CALLE + NEBLINA * 2;

  const n = ciudad.ancho * ciudad.alto;
  ciudad.tipo = new Uint8Array(n);
  ciudad.casilla = new Int16Array(n).fill(-1);
  ciudad.puertas = [];

  for (const par of ciudad.celdas) {
    const partes = par[0].split(",");
    const cx = +partes[0], cy = +partes[1], diseno = par[1];
    const ox = NEBLINA + (cx - minX) * UNIDAD;
    const oy = NEBLINA + (cy - minY) * UNIDAD;
    const rejilla = UNIDADES[diseno];

    for (let uy = 0; uy < UNIDAD; uy++) {
      for (let ux = 0; ux < UNIDAD; ux++) {
        const i = (oy + uy) * ciudad.ancho + (ox + ux);
        ciudad.casilla[i] = rejilla[uy][ux];
        ciudad.tipo[i] = tipoDeCasilla(ux, uy);
      }
    }

    /* las puertas, sobre la banqueta de abajo de la manzana */
    for (const columna of CIUDAD_PUERTAS[diseno]) {
      const puerta = {
        x: ox + CIUDAD_CALLE + columna,
        y: oy + CIUDAD_CALLE + CIUDAD_MANZANA - CIUDAD_BANQUETA
      };
      if (diseno === CIUDAD_PIZZERIA) ciudad.pizzeria = puerta;
      else ciudad.puertas.push(puerta);
    }
  }

  /* calzada de cierre */
  for (let y = NEBLINA; y < ciudad.alto - NEBLINA; y++) {
    for (let d = 0; d < CIUDAD_CALLE; d++) {
      const i = y * ciudad.ancho + NEBLINA + ciudad.cols * UNIDAD + d;
      if (ciudad.casilla[i] === -1) { ciudad.casilla[i] = CASILLA_CALLE; ciudad.tipo[i] = T_CALLE; }
    }
  }
  for (let x = NEBLINA; x < ciudad.ancho - NEBLINA; x++) {
    for (let d = 0; d < CIUDAD_CALLE; d++) {
      const i = (NEBLINA + ciudad.filas * UNIDAD + d) * ciudad.ancho + x;
      if (ciudad.casilla[i] === -1) { ciudad.casilla[i] = CASILLA_CALLE; ciudad.tipo[i] = T_CALLE; }
    }
  }

  for (let i = 0; i < n; i++) if (ciudad.casilla[i] === -1) ciudad.tipo[i] = T_NIEBLA;
  return corrimiento;
}

/* Añade una manzana pegada a la ciudad, eligiendo el hueco con más vecinos
   para que crezca compacta y no en tentáculos. */
function agregarManzana() {
  const candidatas = new Map();
  for (const clave of ciudad.celdas.keys()) {
    const partes = clave.split(",");
    const cx = +partes[0], cy = +partes[1];
    for (const d of [[1,0],[-1,0],[0,1],[0,-1]]) {
      const k = (cx + d[0]) + "," + (cy + d[1]);
      if (!ciudad.celdas.has(k)) candidatas.set(k, (candidatas.get(k) || 0) + 1);
    }
  }
  if (!candidatas.size) return;
  let mejor = 0;
  for (const v of candidatas.values()) if (v > mejor) mejor = v;
  const buenas = [];
  for (const par of candidatas) if (par[1] === mejor) buenas.push(par[0]);
  ciudad.celdas.set(buenas[entero(buenas.length)], manzanaAlAzar());
}

/* ───────────────── El pizzero ───────────────── */

const DIRS = {
  arriba:    { dx: 0, dy:-1 },
  abajo:     { dx: 0, dy: 1 },
  izquierda: { dx:-1, dy: 0 },
  derecha:   { dx: 1, dy: 0 }
};

const jugador = { x:0, y:0, px:0, py:0, dir:"abajo", moviendo:false, cuadro:0 };

const juego = {
  estado: "menu",
  entregas: 0, fase: 0, pizzas: [],
  sinEntregar: 0, tiempo: 0,
  record: leerRecord()
};

function leerRecord() {
  try { return parseInt(localStorage.getItem("stumpffia:pizzero"), 10) || 0; }
  catch (e) { return 0; }
}
function guardarRecord(v) {
  try { localStorage.setItem("stumpffia:pizzero", String(v)); } catch (e) {}
}

function fase() { return FASES[juego.fase]; }
function plazoPizza() { return SEGUNDOS_PIZZA - juego.fase * RESTA_POR_FASE; }

/* ───────────────── Pedidos ───────────────── */

function puertaLibre() {
  const ocupadas = new Set(juego.pizzas.map(function (p) { return p.casa.x + "," + p.casa.y; }));
  const libres = ciudad.puertas.filter(function (p) { return !ocupadas.has(p.x + "," + p.y); });
  return libres.length ? libres[entero(libres.length)] : null;
}

function recoger() {
  while (juego.pizzas.length < fase().capacidad) {
    const casa = puertaLibre();
    if (!casa) break;
    juego.pizzas.push({ casa: { x: casa.x, y: casa.y }, queda: plazoPizza() });
  }
}

function correrTodo(d) {
  if (!d.x && !d.y) return;
  jugador.x += d.x; jugador.y += d.y;
  jugador.px += d.x; jugador.py += d.y;
  for (const p of juego.pizzas) { p.casa.x += d.x; p.casa.y += d.y; }
}

function entregar(indicePizza) {
  juego.pizzas.splice(indicePizza, 1);
  juego.entregas++;
  juego.sinEntregar = 0;
  if (juego.entregas > juego.record) { juego.record = juego.entregas; guardarRecord(juego.record); }

  agregarManzana();                       // cada pizza, una manzana más
  correrTodo(volcarCiudad());

  if (juego.fase === 0 && juego.entregas >= META_MOTO) ascender(1);
  else if (juego.fase === 1 && juego.entregas >= META_AUTO) ascender(2);
}

/* Al ascender, la ciudad dobla sus manzanas. */
function ascender(nuevaFase) {
  juego.fase = nuevaFase;
  const cuantas = ciudad.celdas.size;
  for (let i = 0; i < cuantas; i++) agregarManzana();
  correrTodo(volcarCiudad());
  for (const p of juego.pizzas) p.queda = Math.min(p.queda, plazoPizza());
  mostrarAscenso();
}

/* ───────────────── Movimiento ───────────────── */

function intentarMover(dir) {
  if (jugador.moviendo || juego.estado !== "jugando") return;
  jugador.dir = dir;
  const d = DIRS[dir];
  const nx = jugador.x + d.dx, ny = jugador.y + d.dy;
  if (!pisable(nx, ny)) return;
  jugador.x = nx; jugador.y = ny;
  jugador.moviendo = true;
  jugador.cuadro = (jugador.cuadro + 1) % 4;
  revisarPuerta();
}

/* Pisar la puerta es recoger o entregar: no hay tecla aparte. */
function revisarPuerta() {
  for (let i = 0; i < juego.pizzas.length; i++) {
    if (juego.pizzas[i].casa.x === jugador.x && juego.pizzas[i].casa.y === jugador.y) {
      entregar(i); return;
    }
  }
  if (ciudad.pizzeria && jugador.x === ciudad.pizzeria.x && jugador.y === ciudad.pizzeria.y) recoger();
}

/* ───────────────── Bucle ───────────────── */

const teclas = Object.create(null);
const ordenDirecciones = [];

function actualizar(dt) {
  if (juego.estado !== "jugando") return;
  juego.tiempo += dt;

  const dir = ordenDirecciones.length
    ? DIRECCION_TECLA[ordenDirecciones[ordenDirecciones.length - 1]] : null;
  if (dir) intentarMover(dir);

  if (jugador.moviendo) {
    const avance = dt / fase().paso;
    jugador.px += Math.sign(jugador.x - jugador.px) * Math.min(avance, Math.abs(jugador.x - jugador.px));
    jugador.py += Math.sign(jugador.y - jugador.py) * Math.min(avance, Math.abs(jugador.y - jugador.py));
    if (jugador.px === jugador.x && jugador.py === jugador.y) jugador.moviendo = false;
  }

  for (let i = juego.pizzas.length - 1; i >= 0; i--) {
    juego.pizzas[i].queda -= dt;
    if (juego.pizzas[i].queda <= 0) juego.pizzas.splice(i, 1);
  }

  juego.sinEntregar += dt;
  if (juego.sinEntregar >= SEGUNDOS_DESPIDO) despedir();
}

function despedir() {
  juego.estado = "despedido";
  mostrarCapa("Te despidieron",
    "Pasaste cinco minutos sin entregar una sola pizza.",
    "Buscar otro trabajo",
    [["Pizzas entregadas", juego.entregas], ["Tu récord", juego.record]]);
}

/* ───────────────── Dibujo ───────────────── */

const lienzo = document.getElementById("lienzo");
const ctx = lienzo.getContext("2d", { alpha: false });
let escala = 3;

function ajustar() {
  lienzo.width = window.innerWidth;
  lienzo.height = window.innerHeight;
  escala = Math.max(2, Math.min(4, Math.floor(Math.min(window.innerWidth, window.innerHeight) / 190)));
  ctx.imageSmoothingEnabled = false;
}
window.addEventListener("resize", ajustar);

function reloj(segundos) {
  const s = Math.max(0, Math.ceil(segundos));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}

function flecha(x, y, angulo, lado) {
  ctx.save();
  ctx.translate(x, y);
  ctx.rotate(angulo);
  ctx.beginPath();
  ctx.moveTo(lado, 0);
  ctx.lineTo(-lado * 0.75, lado * 0.7);
  ctx.lineTo(-lado * 0.3, 0);
  ctx.lineTo(-lado * 0.75, -lado * 0.7);
  ctx.closePath();
  ctx.fillStyle = CLARO;
  ctx.fill();
  ctx.restore();
}

function etiqueta(texto, x, y) {
  const ancho = ctx.measureText(texto).width + 14;
  ctx.fillStyle = "rgba(11,26,74,.92)";
  ctx.strokeStyle = "rgba(126,200,242,.32)";
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x - ancho / 2, y - 11, ancho, 22, 11);
  else ctx.rect(x - ancho / 2, y - 11, ancho, 22);
  ctx.fill();
  ctx.stroke();
  ctx.fillStyle = CLARO;
  ctx.fillText(texto, x, y + 1);
}

/* Señala un sitio: si está en pantalla, una flecha botando encima; si no,
   una flecha pegada al borde apuntando hacia allá, con la distancia. */
function apuntar(sitio, cx, cy, paso, texto, conDistancia) {
  const margen = 54;
  const dentro = cx > margen && cx < lienzo.width - margen &&
                 cy > margen + 40 && cy < lienzo.height - margen;

  if (dentro) {
    const bote = Math.sin(juego.tiempo * 5) * 4;
    flecha(cx, cy - paso * 0.75 + bote, Math.PI / 2, 9);
    etiqueta(texto, cx, cy - paso * 1.5 + bote);
    return;
  }

  const hacia = Math.atan2(cy - lienzo.height / 2, cx - lienzo.width / 2);
  const radio = Math.min(lienzo.width, lienzo.height) / 2 - margen;
  const bx = lienzo.width / 2 + Math.cos(hacia) * radio;
  const by = lienzo.height / 2 + Math.sin(hacia) * radio;
  flecha(bx, by, hacia, 11);
  etiqueta(texto, bx - Math.cos(hacia) * 30, by - Math.sin(hacia) * 30);
}

function dibujar() {
  const paso = TAM * escala;
  const camX = jugador.px * paso - lienzo.width / 2 + paso / 2;
  const camY = jugador.py * paso - lienzo.height / 2 + paso / 2;
  const aX = (x) => x * paso - camX;
  const aY = (y) => y * paso - camY;

  ctx.fillStyle = MARINO;
  ctx.fillRect(0, 0, lienzo.width, lienzo.height);

  const destinos = new Set(juego.pizzas.map(function (p) { return p.casa.x + "," + p.casa.y; }));
  const latido = (juego.tiempo % 0.9) < 0.45;

  const x0 = Math.floor(camX / paso) - 1, y0 = Math.floor(camY / paso) - 1;
  const columnas = Math.ceil(lienzo.width / paso) + 2;
  const filas = Math.ceil(lienzo.height / paso) + 2;

  for (let y = y0; y < y0 + filas; y++) {
    for (let x = x0; x < x0 + columnas; x++) {
      if (!enMapa(x, y)) continue;
      const n = ciudad.casilla[y * ciudad.ancho + x];
      if (n < 0) continue;                 // la niebla se queda en marino liso
      const marcada = latido && destinos.has(x + "," + y);
      ctx.drawImage(marcada ? ATLAS_CIUDAD_MARCADA : ATLAS_CIUDAD,
                    n * TAM, 0, TAM, TAM, aX(x), aY(y), paso, paso);
    }
  }

  ponerSprite(nombreDelJugador(), aX(jugador.px), aY(jugador.py), fase().escala);

  /* los punteros van encima de todo */
  ctx.font = "800 " + Math.round(11 + escala) + "px Nunito, system-ui, sans-serif";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  for (const p of juego.pizzas) {
    apuntar(p.casa, aX(p.casa.x) + paso / 2, aY(p.casa.y) + paso / 2, paso, reloj(p.queda), true);
  }
  if (ciudad.pizzeria && juego.pizzas.length < fase().capacidad) {
    apuntar(ciudad.pizzeria, aX(ciudad.pizzeria.x) + paso / 2, aY(ciudad.pizzeria.y) + paso / 2,
            paso, "PIZZERÍA", false);
  }
}

function ponerSprite(nombre, x, y, veces) {
  const n = indice[nombre];
  if (n === undefined) return;
  const lado = TAM * escala * veces;
  const centrado = (TAM * escala - lado) / 2;
  ctx.drawImage(ATLAS_SPRITES, n * TAM, 0, TAM, TAM,
                Math.round(x + centrado), Math.round(y + centrado), lado, lado);
}

function nombreDelJugador() {
  const f = fase();
  const paso = ["quieto", "paso_1", "quieto", "paso_2"][jugador.moviendo ? jugador.cuadro : 0];
  if (!f.sprite) {
    return (juego.pizzas.length ? "con_pizza" : "sin_pizza") + "_" + jugador.dir + "_" + paso;
  }
  const quieto = f.sprite === "moto" ? "quieta" : "quieto";
  const mov = paso === "quieto" ? quieto : (paso === "paso_1" ? "mov_1" : "mov_2");
  return f.sprite + "_" + jugador.dir + "_con_pizzero_" + mov;
}

/* ───────────────── Marcador ───────────────── */

const elEntregas = document.getElementById("entregas");
const elDespido = document.getElementById("despido");
const elVehiculo = document.getElementById("vehiculo");
const elPizzas = document.getElementById("pizzas");
const fichaDespido = document.getElementById("ficha-despido");

function pintarMarcador() {
  elEntregas.textContent = juego.entregas;
  const queda = Math.max(0, SEGUNDOS_DESPIDO - juego.sinEntregar);
  elDespido.textContent = reloj(queda);
  fichaDespido.classList.toggle("urgente", queda < 60 && juego.estado === "jugando");
  elVehiculo.textContent = fase().nombre;

  while (elPizzas.children.length > juego.pizzas.length) elPizzas.lastChild.remove();
  while (elPizzas.children.length < juego.pizzas.length) {
    const d = document.createElement("div");
    d.className = "ficha";
    d.innerHTML = "<span></span><b></b>";
    elPizzas.appendChild(d);
  }
  juego.pizzas.forEach(function (p, i) {
    const d = elPizzas.children[i];
    d.firstChild.textContent = "PIZZA " + (i + 1);
    d.lastChild.textContent = reloj(p.queda);
    d.classList.toggle("urgente", p.queda < 45);
  });
}

/* ───────────────── Pantallas ───────────────── */

const capa = document.getElementById("capa");
const capaTitulo = document.getElementById("capa-titulo");
const capaTexto = document.getElementById("capa-texto");
const capaBoton = document.getElementById("capa-boton");
const capaMarcas = document.getElementById("capa-marcas");

function mostrarCapa(titulo, texto, boton, filas) {
  capaTitulo.textContent = titulo;
  capaTexto.textContent = texto;
  capaBoton.textContent = boton;
  capaMarcas.innerHTML = "";
  for (const fila of filas || []) {
    const d = document.createElement("div");
    const s = document.createElement("span"); s.textContent = fila[0];
    const b = document.createElement("b"); b.textContent = fila[1];
    d.appendChild(s); d.appendChild(b);
    capaMarcas.appendChild(d);
  }
  capa.classList.add("visible");
}

function mostrarAscenso() {
  const f = fase();
  juego.estado = "pausa";
  mostrarCapa("¡" + f.nombre + "!",
    f.sprite === "moto"
      ? "Diez pizzas entregadas. La moto es tuya: más rápida y con sitio para dos."
      : "Treinta y seis entregas. El auto es tuyo: cuatro pizzas de una tacada.",
    "Seguir repartiendo",
    [["Pizzas a la vez", f.capacidad],
     ["Plazo por pizza", reloj(plazoPizza())],
     ["Manzanas", ciudad.celdas.size]]);
}

function botonCapa() {
  if (juego.estado === "pausa") { juego.estado = "jugando"; capa.classList.remove("visible"); }
  else empezar();
}
capaBoton.addEventListener("click", botonCapa);

/* ───────────────── Arranque ───────────────── */

function empezar() {
  semilla = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
  juego.entregas = 0; juego.fase = 0; juego.pizzas = [];
  juego.sinEntregar = 0; juego.tiempo = 0;

  /* tres por tres manzanas, con la pizzería en el centro */
  ciudad.celdas = new Map();
  ciudad.minX = 0; ciudad.minY = 0;
  for (let cy = 0; cy < 3; cy++) {
    for (let cx = 0; cx < 3; cx++) {
      ciudad.celdas.set(cx + "," + cy, (cx === 1 && cy === 1) ? CIUDAD_PIZZERIA : manzanaAlAzar());
    }
  }
  volcarCiudad();

  /* Empieza AL LADO de la puerta, no encima: recoger y entregar se
     disparan al pisar la casilla, así que si naciera sobre ella no podría
     recoger sin salir y volver a entrar. */
  jugador.x = ciudad.pizzeria.x;
  jugador.y = ciudad.pizzeria.y + 1;
  if (!pisable(jugador.x, jugador.y)) jugador.y = ciudad.pizzeria.y - 1;
  jugador.px = jugador.x; jugador.py = jugador.y;
  jugador.dir = "abajo"; jugador.moviendo = false; jugador.cuadro = 0;

  juego.estado = "jugando";
  capa.classList.remove("visible");
  ajustar();
}

/* ───────────────── Controles ───────────────── */

const DIRECCION_TECLA = {
  ArrowUp:"arriba", KeyW:"arriba", ArrowDown:"abajo", KeyS:"abajo",
  ArrowLeft:"izquierda", KeyA:"izquierda", ArrowRight:"derecha", KeyD:"derecha"
};

function pulsar(code) {
  if (!DIRECCION_TECLA[code]) { teclas[code] = true; return; }
  const i = ordenDirecciones.indexOf(code);
  if (i !== -1) ordenDirecciones.splice(i, 1);
  ordenDirecciones.push(code);
  teclas[code] = true;
}
function soltar(code) {
  teclas[code] = false;
  const i = ordenDirecciones.indexOf(code);
  if (i !== -1) ordenDirecciones.splice(i, 1);
}

addEventListener("keydown", function (e) {
  if (e.code === "Space" || e.code === "Enter") {
    if (juego.estado !== "jugando") { e.preventDefault(); botonCapa(); }
    return;
  }
  if (DIRECCION_TECLA[e.code]) { e.preventDefault(); if (!e.repeat) pulsar(e.code); }
});
addEventListener("keyup", function (e) { soltar(e.code); });
addEventListener("blur", function () {
  for (const k in teclas) teclas[k] = false;
  ordenDirecciones.length = 0;
});

if (matchMedia("(hover: none)").matches) document.body.classList.add("tactil");
const mapaTactil = { arriba:"ArrowUp", abajo:"ArrowDown", izquierda:"ArrowLeft", derecha:"ArrowRight" };
for (const boton of document.querySelectorAll("#mando [data-dir]")) {
  const code = mapaTactil[boton.dataset.dir];
  const on  = function (e) { e.preventDefault(); pulsar(code); };
  const off = function (e) { e.preventDefault(); soltar(code); };
  boton.addEventListener("pointerdown", on);
  boton.addEventListener("pointerup", off);
  boton.addEventListener("pointercancel", off);
  boton.addEventListener("pointerleave", off);
}

/* ───────────────── Marcha ───────────────── */

let ultimo = 0;
function cuadro(ahora) {
  requestAnimationFrame(cuadro);
  const dt = Math.min(0.05, (ahora - ultimo) / 1000 || 0);
  ultimo = ahora;
  actualizar(dt);
  if (ciudad.tipo) { dibujar(); pintarMarcador(); }
}

/* API mínima para probar el juego desde la consola */
window.PIZZERO = { juego, jugador, ciudad, empezar, actualizar, intentarMover,
                   recoger, entregar, agregarManzana, volcarCiudad, pisable,
                   FASES, plazoPizza, UNIDADES, tipoDeCasilla,
                   T_CALLE, T_BANQUETA, T_CASA, T_NIEBLA,
                   get PIZZERIA() { return CIUDAD_PIZZERIA; } };

ajustar();
empezar();
juego.estado = "menu";
mostrarCapa("Pizzero",
  "Recoge las pizzas en el mostrador y llévalas a su casa antes de que se enfríen. La flecha te dice hacia dónde.",
  "Empezar el turno",
  [["Moverte", "↑ ↓ ← →  ·  W A S D"],
   ["Recoger y entregar", "pisa la puerta"],
   ["Tu récord", juego.record + " pizzas"]]);
requestAnimationFrame(cuadro);
</script>
